# This file is loaded separately into each node's private namespace from pf.launch.
# Keep the parameters flat so rospy.get_param('~...') resolves them correctly.

# ── Particle Filter parameters ────────────────────────────────────────────
n_particles: 2000
sigma_dist:  0.05      # distance std [m]
sigma_bear:  0.05      # bearing  std [rad]
alpha: [0.10, 0.05, 0.05, 0.02]  # odometry noise (a1..a4)

# ── ArUco Detector parameters ─────────────────────────────────────────────
tag_size: 0.065         # physical marker side length [m]  (6.5 cm)

# ── Tag map (2-D world-frame positions [m]) ───────────────────────────────
# Must match constants.py and the physical tag placement.
tag_map:
  positions:
    - [ 0.33,  0.00]   # tag 0
    - [ 0.50,  0.00]   # tag 1
    - [ 0.90,  0.25]   # tag 2
    - [ 0.90,  0.45]   # tag 3
    - [ 0.00,  0.42]   # tag 4
    - [ 0.00,  0.71]   # tag 5
    - [ 0.05,  0.90]   # tag 6
    - [ 0.55,  0.90]   # tag 7
  tag_height: 1.00      # marker center height above floor [m]
  room_x: [0.0, 0.90]
  room_y: [0.0, 0.90]
